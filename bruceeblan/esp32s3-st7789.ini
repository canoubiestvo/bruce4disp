[env:esp32s3-st7796]
board = esp32s3
board_build.partitions = custom_8Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/esp32s3-st7789>
build_flags =
	${env.build_flags}
	-Iboards/esp32s3-st7789

	-DCORE_DEBUG_LEVEL=5
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT
	-DUSB_as_HID=1

	; тач пока не подключён, флаги оставлены, чтобы код собирался
	-DHAS_TOUCH=1
	-DTOUCH_CTRL_XPT2046=1
	-DHAS_RESISTIVE_TOUCH=1

	; ==================== Дисплей ST7796S 320x480 ====================
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7796_DRIVER=1
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
	-DTFT_CS=10
	-DTFT_DC=9
	-DTFT_RST=8
	-DTFT_BL=-1
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_MISO=13
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DTOUCH_XPT2046_SPI=1
	-DXPT2046_TOUCH_CONFIG_INT_GPIO_NUM=-1

	-DBTN_ALIAS='"OK"'

	; IR и RF: убрал пины 8 и 9, они теперь заняты дисплеем
	-DIR_TX_PINS='{{"G1", 1}, {"G2", 2}}'
	-DIR_RX_PINS='{{"G1", 1}, {"G2", 2}}'
	-DRF_TX_PINS='{{"G1", 1}, {"G2", 2}}'
	-DRF_RX_PINS='{{"G1", 1}, {"G2", 2}}'

	-DROTATION=1
	-DXPT2046_SPI_BUS_MOSI_IO_NUM=11
	-DXPT2046_SPI_BUS_MISO_IO_NUM=13
	-DXPT2046_SPI_BUS_SCLK_IO_NUM=12
	-DXPT2046_SPI_CONFIG_CS_GPIO_NUM=3
	-DINPUT_HANDLER_TASK_STACK_SIZE=8192

	-DDEVICE_NAME='"ESP32-S3 ST7796"'

lib_deps =
	${env.lib_deps}
